# Fictional redirect-only host. Issue its real certificate before enabling TLS.
# No application, gateway route or nf site inventory record is needed.
server {
    listen 80;
    listen 443 ssl;
    server_name retired.example.com www.retired.example.com;
    ssl_certificate /etc/letsencrypt/live/retired.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/retired.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    # Keep the redirect inside a location so ACME challenges remain reachable.
    location / { return 301 https://www.example.net$request_uri; }
}
