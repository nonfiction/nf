pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 5s;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 25s;
    proxy_send_timeout 15s;
    proxy_buffering off;
    proxy_pass_request_headers off;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 4;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_ssl_server_name on;
    proxy_intercept_errors on;
    server {
        listen 8080;
        server_name _;
        error_page 301 302 303 307 308 =502 /_redirect_denied;
        location = /_redirect_denied { internal; return 502; }
        location / { return 403; }
        location = /feeds/client {
            limit_except GET { deny all; }
            set $feed_host feeds.example.com;
            proxy_set_header Host feeds.example.com;
            proxy_set_header User-Agent Nterchange/1.0;
            proxy_ssl_name feeds.example.com;
            proxy_pass https://$feed_host/client.xml;
        }
        location = /perfectmind/api/2.0/B2C/Appointments {
            limit_except GET { deny all; }
            set $perfectmind_host client.perfectmind.com;
            proxy_set_header Host client.perfectmind.com;
            proxy_set_header X-Access-Key $http_x_access_key;
            proxy_set_header X-Client-Number $http_x_client_number;
            proxy_set_header Content-Type application/json;
            proxy_ssl_name client.perfectmind.com;
            proxy_pass https://$perfectmind_host/api/2.0/B2C/Appointments$is_args$args;
        }
        location = /recaptcha/api/siteverify {
            limit_except POST { deny all; }
            set $captcha_host www.google.com;
            proxy_set_header Host www.google.com;
            proxy_set_header Content-Type application/x-www-form-urlencoded;
            proxy_ssl_name www.google.com;
            proxy_pass https://$captcha_host/recaptcha/api/siteverify;
        }
    }
}
