worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
stream {
    resolver 127.0.0.11 ipv6=off valid=30s;
    server {
        listen 2525;
        set $sendgrid smtp.sendgrid.net:2525;
        proxy_pass $sendgrid;
        proxy_connect_timeout 10s;
        proxy_timeout 60s;
    }
}
