date.timezone = America/Edmonton
sendmail_path = "/bin/sh -c '/usr/bin/msmtp -t || exit 1'"
upload_max_filesize = 32M
post_max_size = 40M
memory_limit = 256M
log_errors = On
display_errors = Off
apc.enable_cli = 1
session.save_path = /var/www/site/var/sessions
session.cookie_secure = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
expose_php = Off
