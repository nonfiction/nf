ServerName nf-review
<IfModule mpm_prefork_module>
    StartServers 1
    MinSpareServers 1
    MaxSpareServers 2
    ServerLimit 4
    MaxRequestWorkers 4
    MaxConnectionsPerChild 500
</IfModule>
<VirtualHost *:80>
    # A separately approved host timer owns production cleanup; never collect during requests.
    php_admin_value session.gc_probability 0
    DocumentRoot /var/www/site/public_html
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on
    <Directory /var/www/site/public_html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    Alias /nterchange/assets/ /var/www/site/vendor/nonfiction/nterchange/nterchange/
    Alias /nterchange/images /var/www/site/vendor/nonfiction/nterchange/nterchange/images
    Alias /nterchange/javascripts /var/www/site/vendor/nonfiction/nterchange/nterchange/javascripts
    Alias /nterchange/stylesheets /var/www/site/vendor/nonfiction/nterchange/nterchange/stylesheets
    <Directory /var/www/site/vendor/nonfiction/nterchange/nterchange>
        Options +FollowSymLinks -Indexes
        AllowOverride None
        Require all granted
        <FilesMatch "^(?!button\.php$).*\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    <Directory /var/www/site/public_html/upload>
        AllowOverride None
        Options -ExecCGI -Indexes
        <FilesMatch "\.(php[0-9]?|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>
    Header always set Content-Security-Policy "default-src 'self' data: 'unsafe-inline' 'unsafe-eval'; form-action 'self'; connect-src 'self'; frame-src 'self'"
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
