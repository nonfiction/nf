# Install separately from nginx-sites.conf so protected review routes stay local.
# Replace client.example.com and certificate paths with the approved public pair.
server {
    listen 80;
    server_name client.example.com www.client.example.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name client.example.com www.client.example.com;
    ssl_certificate /etc/letsencrypt/live/client.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/client.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 40m;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location ~* /autodiscover/autodiscover.xml { return 404; }
    location = /xmlrpc.php { return 403; }
    location = /wp/xmlrpc.php { return 403; }
    location / {
        # Active local route. Comment all three lines before enabling proxy-back.
        proxy_pass http://127.0.0.1:18080;
        proxy_set_header Host $host;
        proxy_redirect http://$host/ https://$host/;

        # Temporary proxy-back. Use an independently verified, stable origin.
        # Never use the public domain or movable reserved IP as the upstream.
        # proxy_pass https://client.old-origin.example:443;
        # proxy_set_header Host www.client.example.com;
        # proxy_ssl_server_name on;
        # proxy_ssl_name client.old-origin.example;
        # proxy_ssl_verify on;
        # proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        # proxy_redirect http://client.old-origin.example/ https://$host/;
        # proxy_redirect https://client.old-origin.example/ https://$host/;
        # proxy_redirect http://www.client.example.com/ https://$host/;
        # proxy_redirect https://www.client.example.com/ https://$host/;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
        proxy_next_upstream off;
    }
}
