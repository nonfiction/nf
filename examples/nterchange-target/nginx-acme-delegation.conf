# Include only in approved migrating vhosts on the OLD public proxy.
# Replace the old webroot and documentation address with verified real values.
# Existing old-server renewals keep working; only missing tokens reach the new host.
location ^~ /.well-known/acme-challenge/ {
    root /etc/nginx/html;
    try_files $uri @nf_new_acme;
}
location @nf_new_acme {
    proxy_pass http://192.0.2.20;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_next_upstream off;
}
