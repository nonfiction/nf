server {
    listen 80;
    server_name client.review1.example.com;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 308 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name client.review1.example.com;
    ssl_certificate /etc/letsencrypt/live/review1.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/review1.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    auth_basic "nf private review";
    auth_basic_user_file /etc/nf/nterchange/secrets/review.htpasswd;
    client_max_body_size 40m;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Cache-Control "no-store" always;
    location = /_nf/health {
        auth_basic off;
        default_type text/plain;
        return 200 "nf ready\n";
    }
    location / {
        proxy_pass http://127.0.0.1:18080;
        # TLS ends here; keep upstream directory redirects on the public HTTPS origin.
        proxy_redirect http://$host/ https://$host/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Authorization "";
    }
}
