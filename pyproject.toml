[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nf"
version = "0.1.0"
description = "Safe local nf CLI skeleton"
requires-python = ">=3.11"

[project.scripts]
nf = "nf.cli:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["nf*"]
